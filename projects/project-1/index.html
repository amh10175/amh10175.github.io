<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaTracks</title>
    <style>
     #primary-nav ul { 
        padding-left: 0;
        background-color: #8C2639;
        justify-content: flex-end;
        }
    #primary-nav li { 
        list-style: none; 
        display: inline-block;
        }
    #primary-nav a { 
        display: inline-block; 
        padding: 1em;
        } 
    body {
        margin: 0;
        padding: 0;
    }
    main{
        margin: 3em auto;
        max-width: 56em;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
    }
    .grid > div {
      background: #eaeaea;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      height: 800px;
      margin: 10px;
      flex: 1 1 200px;
    }
    </style>
</head>
<body>
     <nav id="primary-nav">
        <div class="inner">
            <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#">Tracks</a></li>
            <li><a href="#">Map</a></li>
            </ul>
        </div>
    </nav>
    <main>
        <h1>Central PA Racing</h1>
        <img src="../../images/tylar.svg" alt="tylar">
        <h2>Race Tracks</h2>
        <div class="grid">
            <div>
                <img src="../../images/grove.svg" alt="Track 1">
                <h3>William's Grove Speeday</h3>
            </div>
            <div>
                <img src="../../images/path.svg" alt="Track 2">
                <h3>Path Valley Speedway</h3>
            </div>
            <div>
                <img src="../../images/lindas.svg" alt="Track 3">
                <h3>Linda's Speedway</h3>
            </div>
            <div>
                <img src="../../images/lincoln.svg" alt="Track 4">
                <h3>Lincoln Speedway</h3>
            </div>
            <div>
                <img src="../../images/baps.svg" alt="Track 5">
                <h3>BAPS Speedway</h3>
            </div>
            <div>
                <img src="../../images/clyde.svg" alt="Track 6">
                <h3>Clyde Martin Memorial Speedway</h3>
            </div>
            <div>
                <img src="../../images/port.svg" alt="Track 7">
                <h3>Port Royal Speedway</h3>
            </div>
            <div>
                <img src="../../images/mcgrew.svg" alt="Track 8">
                <h3>McGrewbid Motoplex</h3>
            </div>
            <div>
                <img src="../../images/shellys.svg" alt="Track 9">
                <h3>Shellhammer Dirt Track</h3>
            </div>
            <div>
                <img src="../../images/selinsgrove.svg" alt="Track 10">
                <h3>Selinsgrove Speedway</h3>
            </div>
        </div>
    </main>
</body>
</html>
