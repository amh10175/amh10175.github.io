<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <style>
        #primary-nav ul { padding-left: 0; }
        #primary-nav li { 
        list-style: none; 
        display: inline-block;
        }
        #primary-nav a { 
        background-color: cornflowerblue;
        display: block; 
        padding: 1em;
        } 
        @media (max-width: 767px) { 
        #primary-nav li { 
        display:block; 
        }
        .inner {overflow: hidden;}
        }
        #toggle-nav-btn {
        display: none;
        position: absolute;
        right: 1em;
        top: 1em;
        }
        @media (max-width: 767px) {
        /* Additional styles here... */
        #toggle-nav-btn {
        display: block;
        }
        }
        @media (max-width: 767px) {
    #primary-nav {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.5s ease-out;
    }
    #primary-nav li {
      display: block;
    }
    body.nav-open #primary-nav {
      grid-template-rows: 1fr;
    }
    .inner {
      overflow: hidden;
    }
    #toggle-nav-btn {
      display: block; /* display button beneath breakpoint */
    }
  }
    </style>
</head>
<body>
    <nav id="primary-nav">
        <div class="inner">
            <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>
    <h1>Contact</h1>
    <p>Please don't contact me.</p>
    <script>
        // Perform this after the window has loaded
        window.onload = () => {
        // First, tell JavaScript to remember which DOM element (in this case, a button) to reference (by id)
        const toggleNavBtn = document.getElementById('toggle-nav-btn');
        toggleNavBtn.innerHTML = '&#9776;';

        // Tell button to do something on click
        toggleNavBtn.addEventListener('click', () => {
        // toggle the body's class attribute
        document.body.classList.toggle('nav-open');
        toggleNavBtn.innerHTML = document.body.classList.contains('nav-open')
          ? '&#x2715'
          : '&#9776;';
      });
    };
    </script></Code>
</body>
<button id="toggle-nav-btn"></button>
</html>
