<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .container {
            position: relative;
            border: 5px solid black;
            padding: 20px;
            width: 700px;
            height: 700px;
        }
        .box1 {
            position: relative;
            z-index: 1;
            width: 300px;
            height: 300px;
            background-color: rgb(1, 168, 252);
        }
        .box2 {
            position: absolute;
            z-index: 2;
            width: 300px;
            height: 300px;
            top: 125px;
            left: 125px;
            background-color: rgb(121, 13, 13);
        }
        .box3 {
            position: absolute;
            z-index: 3;
            width: 300px;
            height: 300px;
            top: 250px;
            left: 250px;
            background-color: rgb(104, 105, 104);
        }
    </style>
</head>
<body>
        <div class="container"></div>
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
</body>
</html>
