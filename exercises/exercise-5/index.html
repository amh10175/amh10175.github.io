<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #primary-nav ul { padding-left: 0; }
        #primary-nav li { 
        list-style: none; 
        display: inline-block;
        }
        #primary-nav a { 
        background-color: cornflowerblue;
        display: block; 
        padding: 1em;
        } 
        @media (max-width: 767px) { 
        #primary-nav li { 
        display:block; 
        }
        .inner {overflow: hidden;}
        }
        #toggle-nav-btn {
        display: none;
        position: absolute;
        right: 1em;
        top: 1em;
        }
        @media (max-width: 767px) {
        /* Additional styles here... */
        #toggle-nav-btn {
        display: block;
        }
        }
        @media (max-width: 767px) {
    #primary-nav {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.5s ease-out;
    }
    #primary-nav li {
      display: block;
    }
    body.nav-open #primary-nav {
      grid-template-rows: 1fr;
    }
    .inner {
      overflow: hidden;
    }
    #toggle-nav-btn {
      display: block; /* display button beneath breakpoint */
    }
  }
    </style>
</head>
<body>
    <nav id="primary-nav">
        <div class="inner">
            <ul>
            <li><a href="index.html">Alyssa</a></li>
            <li><a href="boyfriend.html">My Boyfriend</a></li>
            <li><a href="car.html">My Car</a></li>
            <li><a href="dog.html">My Dog</a></li>
            </ul>
        </div>
    </nav>
    <h1>Me</h1>
    <img src="../../images/me.svg" alt="Alyssa">
    <p>I am Alyssa. I'm super cool, super awesome, and super humble.</p>
    <script>
        window.onload = () => {
        const toggleNavBtn = document.getElementById('toggle-nav-btn');
        toggleNavBtn.innerHTML = '&#9776;';

        toggleNavBtn.addEventListener('click', () => {
        document.body.classList.toggle('nav-open');
        toggleNavBtn.innerHTML = document.body.classList.contains('nav-open')
          ? '&#x2715'
          : '&#9776;';
      });
    };
    </script></Code>
</body>
<button id="toggle-nav-btn"></button>
</html>
